services:
  - type: web
    name: campusconnect
    runtime: node
    buildCommand: npm --prefix Backend ci && npm --prefix Backend run build:frontend
    startCommand: npm --prefix Backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
