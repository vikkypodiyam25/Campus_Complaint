services:
  - type: web
    name: campusconnect
    runtime: node
    rootDir: Backend
    buildCommand: npm ci && npm run build:frontend
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_BUILD_PATH
        value: ../frontend/dist
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
